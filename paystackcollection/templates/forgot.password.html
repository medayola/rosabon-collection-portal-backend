<html>

<head>
    <style>
        .m-0 {
            margin: 0px !important;
        }

        hr {
            box-sizing: content-box;
            height: 0;
            overflow: visible;
            margin-top: 1rem;
            margin-bottom: 1rem;
            border: 0;
            border-top: 1px solid rgba(0, 0, 0, .1);
        }

        .table-bordered {
            border: 1px solid #e3e6f0;
        }

        .table-bordered td,
        .table-bordered th {
            border: 1px solid #e3e6f0;
        }

        .table td,
        .table th {
            padding: .75rem;
            vertical-align: top;
            border-top: 1px solid #e3e6f0;
        }

        .table {
            width: 100%;
            margin-bottom: 1rem;
            color: #858796;
            border-collapse: collapse;
        }

        .container-fluid {
            margin: 0px auto;
            width: 800px;
            font-size: small;
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-width: 0;
            word-wrap: break-word;
            background-color: #fff;
            background-clip: border-box;
            border: 1px solid #e3e6f0;
            border-radius: .35rem;
        }

        .h6 {
            margin-bottom: .5rem;
            font-weight: 400;
            line-height: 1.2;
            font-size: 1.2rem;
        }

        .btn {
            display: inline-block;
            font-weight: 400;
            color: #858796;
            text-align: center;
            vertical-align: middle;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            background-color: transparent;
            border: 1px solid transparent;
            padding: .375rem .75rem;
            font-size: 1rem;
            line-height: 1.5;
            border-radius: .35rem;
        }

        .btn-block {
            padding: .25rem .5rem;
            font-size: .875rem;
            line-height: 1.5;
            border-radius: .2rem;
            text-decoration: none;
        }

        .btn-primary {
            background-color: #2653d4;
            border-color: #2653d4;
            color: #fff;
        }

        .btn-danger {
            background-color: #ca2819;
            border-color: #ca2819;
            color: #fff;
        }

        .card-footer {
            padding:1.25rem;
        }

        .card-body {
            flex: 1 1 auto;
            padding: 0rem 1.25rem 0rem 1.25rem;
        }

        .card-header {
            padding: .05rem 0.75rem;
            margin-bottom: 0;
            background-color: #f8f9fc;
            border-bottom: 1px solid #e3e6f0
        }

        .mb-4 {
            margin-bottom: 1.5rem !important;
        }
    </style>
</head>

<body>
    <div class="container-fluid my-4">
        <table style="padding:10px;" class="card">
            <tr>
                <td colspan="2">
                    <h6 class="m-0 h6 text-capitalize">Reset Password Request!</h6>
                </td>
            </tr>
            <tr>
                <td>Dear {{staff.name}},</td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>
                    <a href="{{reset_link}}" class="btn btn-block btn-primary text-uppercase mb-4" style="color:#FFF;">
                        kindly, click me to reset your password!
                    </a>
                </td>
                <td></td>
            </tr>
            <tr>
                <td>
                <small>
                    <code>
                        -- system generated email --
                    </code>
                </small>
                <br>
                <small>
                    <code>
                        &copy; rosabon finance (SDTEAM)
                    </code>
                </small>
                </td>
                <td></td>
            </tr>
        </table>
        
    </div>
</body>

</html>
